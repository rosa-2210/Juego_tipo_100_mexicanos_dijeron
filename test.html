<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Juego</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div style="padding: 20px;">
        <h1>Test de Juego</h1>
        <button onclick="testGame()">Probar game.startRound()</button>
        <div id="output"></div>
    </div>
    
    <script src="shared.js"></script>
    <script src="juego.js"></script>
    <script>
        function testGame() {
            const output = document.getElementById('output');
            output.innerHTML = '';
            
            try {
                output.innerHTML += '<p>✓ game existe: ' + (typeof game !== 'undefined') + '</p>';
                output.innerHTML += '<p>✓ game.init existe: ' + (typeof game.init === 'function') + '</p>';
                output.innerHTML += '<p>✓ game.startRound existe: ' + (typeof game.startRound === 'function') + '</p>';
                
                const surveys = Shared.getSurveys();
                output.innerHTML += '<p>✓ Encuestas cargadas: ' + surveys.length + '</p>';
                
                if (surveys.length > 0) {
                    output.innerHTML += '<p>✓ Primera encuesta: ' + surveys[0].question.substring(0, 50) + '...</p>';
                }
                
                output.innerHTML += '<p style="color: green;">¡Todo parece correcto! Abre juego.html</p>';
            } catch (e) {
                output.innerHTML += '<p style="color: red;">Error: ' + e.message + '</p>';
            }
        }
        
        window.onload = function() {
            document.getElementById('output').innerHTML = '<p>Cargando...</p>';
            setTimeout(testGame, 1000);
        };
    </script>
</body>
</html>
